name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: Test (Ruby ${{ matrix.entry.ruby }})
    runs-on: ${{ matrix.entry.os }}
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { ruby: '3.0', os: ubuntu-22.04 }
          - { ruby: '4.0', os: ubuntu-latest }
    steps:
      - name: Check Out
        uses: actions/checkout@v7
      - name: Set Up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.entry.ruby }}
          bundler-cache: true
      - name: Run Tests
        run: bundle exec rake test
